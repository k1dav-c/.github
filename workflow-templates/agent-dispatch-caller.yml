# Carries this repository's pull request events to the agentapi hub for
# the jobs started from the hub's Issues page (Assign): the reviews and
# "/agent …" comments go to the same agent, and a closed pull request stops
# its job. A label doesn't start one: the caller listens to no issues
# event. The work is done by k1dav-c/.github's agent-dispatch.yml on the
# self-hosted runners labeled agent-dispatch; private repositories only.
name: agent

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  dispatch:
    uses: k1dav-c/.github/.github/workflows/agent-dispatch.yml@main
